<!DOCTYPE html>
<html lang="ja" data-theme="simple" data-size="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことば ピタッと！</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ことばピタッと">
<meta name="theme-color" content="#fbf7ef">
<meta name="description" content="作文の 小さい字（っ・ゃゅょ）・のばす音・くっつきのことば（助詞）の練習。URLを開くだけ・記録はこの端末だけ。">

<!--
  ことば ピタッと！ — 作文の「小さい字・のばす音」と「くっつきのことば（助詞）」の練習
  小さい字・のばす音は、記号で見せる・手で表す・決まった順で進める・かたまりで読む・くり返して伸びを見る。問題はすべて独自に作成。
  記録はこの端末のブラウザ（localStorage）だけに残る。外には送らない。
  作り直し: _作り直し用/build.py（このファイルを直して build.py を実行する）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Yomogi&family=DotGothic16&display=swap">
<style>
/* ===================== デザイン（4種類） ===================== */
:root{
  --bg:#fbf7ef; --surface:#ffffff; --surface2:#f4eee2; --ink:#1f1d1a; --mute:#5c574f; --line:#ddd4c3;
  --accent:#c4441f; --accent-ink:#ffffff; --soft:#fff1d2; --ok:#16804a; --ng:#c25b00; --focus:#1f6fd1;
  --bw:2px; --radius:18px; --shadow:0 2px 0 rgba(0,0,0,.06);
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  --head:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN",sans-serif;
  --logo:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;
  --bgimg:none;
}
html[data-theme="kokuban"]{
  --bg:#2b4a3a; --surface:#33584a; --surface2:#284235; --ink:#f8f5ea; --mute:#cddbd0; --line:rgba(248,245,234,.35);
  --accent:#f4d668; --accent-ink:#1f3529; --soft:rgba(244,214,104,.18); --ok:#a6f0a6; --ng:#ffc08a; --focus:#f4d668;
  --bw:2px; --radius:14px; --shadow:0 3px 0 rgba(0,0,0,.18);
  --head:"Yomogi","Zen Maru Gothic",sans-serif; --logo:"Yomogi","Zen Maru Gothic",sans-serif;
  --bgimg:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.2),transparent 60%);
}
html[data-theme="omocha"]{
  --bg:#fff6dc; --surface:#ffffff; --surface2:#fff1b8; --ink:#2b2140; --mute:#5a4f6e; --line:#2b2140;
  --accent:#d93636; --accent-ink:#ffffff; --soft:#ffeaa0; --ok:#137a43; --ng:#c45000; --focus:#2b2140;
  --bw:3px; --radius:24px; --shadow:5px 5px 0 #2b2140;
  --head:"Zen Maru Gothic",sans-serif; --logo:"Zen Maru Gothic",sans-serif;
  --bgimg:radial-gradient(#ffd98a 2px,transparent 2.6px);
}
html[data-theme="uchu"]{
  --bg:#0b1033; --surface:#18215a; --surface2:#111845; --ink:#f0f4ff; --mute:#b4bfe8; --line:rgba(140,175,255,.45);
  --accent:#ff5fd2; --accent-ink:#1b0b2e; --soft:rgba(79,240,255,.14); --ok:#74f5ad; --ng:#ffbd7a; --focus:#4ff0ff;
  --bw:2px; --radius:16px; --shadow:0 0 16px rgba(79,240,255,.18);
  --head:"Zen Maru Gothic",sans-serif; --logo:"DotGothic16","Zen Maru Gothic",sans-serif;
  --bgimg:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe0ff,transparent),radial-gradient(2px 2px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 70px 200px,#ffd6f5,transparent),radial-gradient(1.5px 1.5px at 260px 40px,#d6fbff,transparent);
}
html[data-theme="soccer"]{
  --bg:#dcefd6; --surface:#ffffff; --surface2:#eef7ea; --ink:#13261a; --mute:#3d5a45; --line:#9cc79f;
  --accent:#1c7a3a; --accent-ink:#ffffff; --soft:#e3f5dd; --ok:#13703a; --ng:#b85400; --focus:#13261a;
  --bw:2px; --radius:16px; --shadow:0 3px 0 rgba(19,38,26,.15);
  --head:"Zen Maru Gothic",sans-serif; --logo:"Zen Maru Gothic",sans-serif;
  --bgimg:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 90px,rgba(255,255,255,.28) 90px 180px);
}
html[data-theme="battle"]{
  --bg:#171a26; --surface:#232838; --surface2:#1c2030; --ink:#f4f6ff; --mute:#bcc3dc; --line:rgba(255,176,32,.5);
  --accent:#ffb020; --accent-ink:#171a26; --soft:rgba(255,176,32,.16); --ok:#7cf29a; --ng:#ffb39c; --focus:#ffb020;
  --bw:2px; --radius:14px; --shadow:0 0 18px rgba(255,120,30,.18);
  --head:"Zen Maru Gothic",sans-serif; --logo:"Zen Maru Gothic",sans-serif;
  --bgimg:radial-gradient(ellipse at 50% 120%,rgba(255,110,20,.28),transparent 60%),radial-gradient(ellipse at 50% -20%,rgba(80,140,255,.22),transparent 55%);
}
html[data-theme="soccer"] .topbar{background:#1c7a3a;border-bottom:4px solid #fff;color:#fff}
html[data-theme="soccer"] .logo b{color:#fff59d}
html[data-theme="soccer"] .barbtn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6);color:#fff}
html[data-theme="battle"] .topbar{background:#0f111a;border-bottom:3px solid #ffb020;box-shadow:0 0 16px rgba(255,140,30,.35)}
html[data-theme="battle"] .logo b{color:#ffb020}
html[data-theme="battle"] .opt:not(:disabled):hover,html[data-theme="battle"] .mode:hover{box-shadow:0 0 18px rgba(255,176,32,.5)}
html[data-theme="soccer"] .c1{--c:#1c7a3a}html[data-theme="soccer"] .c2{--c:#1d5fb8}html[data-theme="soccer"] .c3{--c:#c0392b}html[data-theme="soccer"] .c4{--c:#2b2b2b}html[data-theme="soccer"] .c5{--c:#7b4bc2}
html[data-theme="battle"] .c1{--c:#ffb020}html[data-theme="battle"] .c2{--c:#4fc3ff}html[data-theme="battle"] .c3{--c:#ff6b5a}html[data-theme="battle"] .c4{--c:#7cf29a}html[data-theme="battle"] .c5{--c:#c6a4ff}
html[data-theme="battle"] .mode .ic{color:#171a26}
html[data-size="s"]{--z:.9} html[data-size="m"]{--z:1.06} html[data-size="l"]{--z:1.24}
html{font-size:calc(18px * var(--z));-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background-color:var(--bg);background-image:var(--bgimg);color:var(--ink);font-family:var(--font);line-height:1.75;letter-spacing:.05em;overflow:hidden;font-feature-settings:"palt" 0}
html[data-theme="omocha"] body{background-size:26px 26px}
html[data-theme="uchu"] body{background-size:300px 240px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
button:disabled{cursor:default}

/* ---------- 上の帯 ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;background:var(--surface);border-bottom:var(--bw) solid var(--line);position:relative;z-index:5}
html[data-theme="kokuban"] .topbar{background:#7a5232;border-bottom:6px solid #563820}
html[data-theme="uchu"] .topbar{background:rgba(11,16,51,.9);border-bottom:2px solid #4ff0ff}
.logo{font-family:var(--logo);font-weight:900;font-size:1.25rem;letter-spacing:.06em;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.logo b{color:var(--accent)}
html[data-theme="kokuban"] .logo{color:#fff3df} html[data-theme="kokuban"] .logo b{color:#f4d668}
html[data-theme="uchu"] .logo b{color:#4ff0ff}
.barbtn{min-height:2.6rem;padding:.2rem .9rem;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface2);font-weight:700;font-size:.95rem;white-space:nowrap}
html[data-theme="kokuban"] .barbtn{background:rgba(0,0,0,.18);border-color:rgba(255,243,223,.5);color:#fff3df}
.barbtn[hidden]{display:none}

/* ---------- みため（デザイン・文字・全画面） ---------- */
.look{flex:0 0 auto;display:none;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;justify-content:center;padding:.6rem .9rem;background:var(--surface2);border-bottom:var(--bw) solid var(--line);z-index:4}
.look.open{display:flex}
.look .grp{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:center}
.look .tl{font-size:.92rem;font-weight:700;color:var(--mute)}
.sw{display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:4.6rem;padding:.35rem .45rem;border-radius:14px;border:var(--bw) solid transparent;background:transparent;font-size:.88rem;font-weight:700}
.sw i{display:block;width:2.6rem;height:1.8rem;border-radius:10px;border:2px solid rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.sw.simple i{background:linear-gradient(135deg,#fbf7ef 50%,#e2572f 50%)}
.sw.kokuban i{background:linear-gradient(135deg,#2b4a3a 50%,#f4d668 50%)}
.sw.omocha i{background:linear-gradient(135deg,#ffd84d 33%,#7fd3ff 33% 66%,#ff9ec7 66%)}
.sw.uchu i{background:radial-gradient(circle at 70% 30%,#4ff0ff 3px,transparent 4px),linear-gradient(135deg,#0b1033 50%,#ff5fd2 50%)}
.sw.soccer i{background:repeating-linear-gradient(90deg,#2e9a4f 0 8px,#3aae5c 8px 16px);box-shadow:inset 0 0 0 2px #fff}
.sw.battle i{background:radial-gradient(circle at 50% 70%,#ffb020 0 5px,transparent 6px),linear-gradient(135deg,#171a26 50%,#ff6b1a 50%)}
.seg{display:flex;border-radius:999px;overflow:hidden;border:var(--bw) solid var(--line)}
.seg button{min-height:2.5rem;min-width:2.8rem;border:0;background:var(--surface);font-weight:700;padding:0 .7rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- 本体 ---------- */
main{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:1rem max(16px,env(safe-area-inset-left)) 1.4rem}
.wrap{max-width:1000px;margin:0 auto}
.h1{font-family:var(--head);font-weight:900;font-size:1.6rem;line-height:1.4;margin:.2rem 0 .8rem;letter-spacing:.06em}
.lead{font-size:1.1rem;color:var(--mute);margin:0 0 1rem;line-height:1.8}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem 1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.4rem;padding:.4rem 1.6rem;border-radius:999px;border:var(--bw) solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.15rem;box-shadow:var(--shadow);letter-spacing:.06em}
html[data-theme="omocha"] .btn{border-color:var(--line)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;transform:none}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:center}

/* ホーム */
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.9rem}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;padding:1rem 1.1rem 1.1rem;border-radius:var(--radius);border:var(--bw) solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-height:8rem;position:relative;transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .no{font-family:var(--head);font-weight:900;font-size:.85rem;color:var(--mute);letter-spacing:.1em}
.mode .t{font-family:var(--head);font-weight:900;font-size:1.3rem;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.mode .d{font-size:1rem;color:var(--mute);line-height:1.6}
.mode .ex{margin-top:auto;font-size:1.15rem;font-weight:700;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.mode .badge{position:absolute;top:-.85rem;right:.8rem;font-size:.85rem;font-weight:700;padding:.1rem .6rem;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
html[data-theme="omocha"] .homegrid .mode:nth-child(1){background:#ffe27a}
html[data-theme="omocha"] .homegrid .mode:nth-child(2){background:#a8e2ff}
html[data-theme="omocha"] .homegrid .mode:nth-child(3){background:#ffc2dc}
html[data-theme="omocha"] .homegrid .mode:nth-child(4){background:#b9efc4}
html[data-theme="omocha"] .homegrid .mode:nth-child(5){background:#ffd0a8}
html[data-theme="kokuban"] .mode{background:rgba(0,0,0,.14);border-style:dashed}
.likes{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;justify-content:center;margin:-.2rem 0 1rem}
.likes .tl{font-weight:700;color:var(--mute);font-size:.95rem;margin-right:.2rem}
.like{min-height:2.7rem;padding:.2rem .9rem;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:.98rem}
.like.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subrow{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1.1rem}
.subrow .btn{font-size:1rem;min-height:3rem}
.stampline{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:.2rem 0 1rem;font-weight:700;color:var(--mute)}
.stampline b{font-size:1.4rem;color:var(--ink)}

/* 記号（●ふつう ○っ ―のばす ◎ゃゅょ） */
.sy{display:inline-block;vertical-align:middle;flex:0 0 auto}
.sy.dot{width:1.05em;height:1.05em;border-radius:50%;background:currentColor}
.sy.ring{width:1.05em;height:1.05em;border-radius:50%;border:.16em solid currentColor;background:transparent}
.sy.bar{width:1.6em;height:.26em;border-radius:.2em;background:currentColor}
.sy.dbl{width:1.15em;height:1.15em;border-radius:50%;border:.14em solid currentColor;background:radial-gradient(circle,currentColor 0 .3em,transparent .32em)}
.syms{display:inline-flex;align-items:center;gap:.45em}
.legend{text-align:center;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap}.legend .sy{font-size:.9em;margin-left:.4em}

/* 問題の画面（横長は左右2列） */
.qtop{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem;flex-wrap:wrap}
.qtop .ttl{font-family:var(--head);font-weight:900;font-size:1.1rem}
.dots{display:flex;gap:.35rem;margin-left:auto}
.dots i{width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.dots i.done{background:var(--mute);border-color:var(--mute)}
.dots i.now{background:var(--accent);border-color:var(--accent);transform:scale(1.2)}
.steps{display:flex;gap:.3rem;flex-wrap:wrap}
.steps span{font-size:.88rem;font-weight:700;padding:.2rem .7rem;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps span .sn{padding:0;border:0;background:none;border-radius:0;font-size:inherit;color:inherit}
.qwrap{display:grid;gap:1rem}
.qL,.qR{min-width:0}
.prompt{font-family:var(--head);font-weight:900;font-size:1.3rem;margin:0 0 .4rem;line-height:1.45}
.say{font-size:1.02rem;color:var(--mute);margin:.2rem 0 .6rem;line-height:1.75}
.say,.lead,.prompt,.tip,.rule li,.tmsg,.sm2,.note p,.guide p,.guide li,.mode .d,.pstep .d,.nu-s,.modal .box p{word-break:keep-all;overflow-wrap:anywhere}
.pic{font-size:5.4rem;line-height:1.1;text-align:center;margin:.2rem 0}
.word{font-size:2.6rem;font-weight:700;text-align:center;letter-spacing:.12em;line-height:1.3}
.opts{display:grid;gap:.75rem}
.opt{min-height:4.6rem;border-radius:var(--radius);border:var(--bw) solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:2.1rem;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.3rem 1rem;position:relative}
.opt .k{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--mute);font-weight:700;letter-spacing:0}
.opt.symopt{font-size:1.6rem;padding:.4rem .6rem .4rem 1.8rem}
.sycols{display:flex;gap:.35em;align-items:flex-start;justify-content:center;flex-wrap:nowrap;min-width:0}
.syc{display:flex;flex-direction:column;align-items:center;gap:.15rem}
.syc .hi2.sm{font-size:1.05rem}
.opt.symopt.n5{font-size:1.25rem}.opt.symopt.n5 .syc .hi2.sm{font-size:.9rem}.opt.symopt.n7{font-size:1rem}.opt.symopt.n7 .sycols{gap:.25em}.opt.symopt.n7 .syc .hi2.sm{font-size:.75rem}
.opt.wrong{border-color:var(--ng);background:var(--surface2);opacity:.6}
.opt.right{border-color:var(--ok);outline:4px solid var(--ok)}
.opt:not(:disabled):hover{border-color:var(--accent)}
html[data-theme="uchu"] .opt:not(:disabled):hover{box-shadow:0 0 16px rgba(255,95,210,.45)}

/* 手で表す */
.hands{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.hand{min-height:5.6rem;border-radius:var(--radius);border:var(--bw) solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;font-weight:700}
.hand .sy{font-size:1.9rem}
.hand .em{font-size:1.5rem;line-height:1}
.hand .lb{font-size:1rem}
.hand:active{transform:scale(.96)}
.slots{display:flex;gap:.5rem;justify-content:center;align-items:center;flex-wrap:wrap;min-height:3.6rem;padding:.6rem;border-radius:var(--radius);border:var(--bw) dashed var(--line);background:var(--surface2);font-size:1.9rem;margin:.6rem 0}
.slots .ph{font-size:1rem;color:var(--mute);font-weight:700}
.handctl{display:flex;gap:.6rem;justify-content:center;margin-top:.7rem;flex-wrap:wrap}

/* 言葉を「記号の列」と「字の列」で並べる */
.cols{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.col{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:3.2rem;padding:.5rem .35rem;border-radius:14px;border:2px solid transparent;transition:background .2s,border-color .2s,transform .2s}
.col .sy{font-size:1.9rem}
.col .kana{font-size:2.3rem;font-weight:700;line-height:1.1;letter-spacing:.04em;white-space:nowrap}
.col .kana.hide{visibility:hidden}
.col .hl{font-size:.85rem;font-weight:700;color:var(--mute);min-height:1.3em}
.cols.many{gap:.15rem;flex-wrap:nowrap}.cols.many .col{min-width:2.5rem;padding:.4rem .15rem}.cols.many .kana{font-size:1.9rem}.cols.many .sy{font-size:1.55rem}
.cols.many2{gap:.1rem;flex-wrap:nowrap}.cols.many2 .col{min-width:2rem;padding:.35rem .1rem}.cols.many2 .kana{font-size:1.5rem}.cols.many2 .sy{font-size:1.25rem}
.fixopts .opt{min-height:3.4rem;font-size:1.7rem;padding:.2rem .8rem .2rem 2rem}.fixopts .opt.lng{font-size:1.3rem;letter-spacing:.04em}
.fixopts{gap:.55rem}
.mini .cols{margin:.2rem 0}.mini .col{padding:.2rem .15rem;min-width:2.2rem}.mini .kana{font-size:1.5rem}.mini .sy{font-size:1.2rem}.mini .hl{display:none}
.col.now{background:var(--soft);border-color:var(--accent);transform:translateY(-4px)}
.col.sp .kana{color:var(--accent)}
html[data-theme="kokuban"] .col.sp .kana{color:#f4d668}
html[data-theme="uchu"] .col.sp .kana{color:#4ff0ff}

/* きまりカード */
.rule{display:grid;gap:.8rem}
.rule .big{font-family:var(--head);font-weight:900;font-size:1.5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.rule .big .sy{font-size:1.8rem}
.rule ul{margin:0;padding-left:1.3rem;font-size:1.12rem;line-height:1.85}
.rule li{margin:.2rem 0}
.tip{background:var(--soft);border-radius:14px;padding:.7rem 1rem;font-size:1.02rem;line-height:1.85;border:1px solid var(--line)}

/* くっつきのことば（助詞） */
.sent{font-size:2rem;font-weight:700;line-height:2.2;letter-spacing:.08em;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;min-height:1.5em;border-radius:12px;border:3px dashed var(--accent);margin:0 .15em;vertical-align:middle;line-height:1.2;padding:0 .2em;position:relative}
.blank.filled{border-style:solid}
.ask{display:inline-block;font-size:1.05rem;font-weight:700;padding:.2rem .8rem;border-radius:999px;background:var(--soft);border:2px solid var(--line);margin-bottom:.4rem}
.popts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.pt{min-height:5rem;border-radius:var(--radius);border:3px solid rgba(0,0,0,.35);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:2.3rem;font-weight:700;color:#1d1b18;position:relative}
.pt .shape{font-size:1.2rem;opacity:.75}
.pt.wrong{opacity:.4}
.pt.right{outline:5px solid var(--ok)}
.pc-が{background:#ffb3b3}.pc-を{background:#a9d4ff}.pc-に{background:#b6eab0}.pc-で{background:#ffd29a}
.pc-へ{background:#d8c2ff}.pc-は{background:#fff08a}.pc-と{background:#ffc6e4}.pc-や{background:#a6ece6}
.pc-わ,.pc-お,.pc-え{background:#e9e4da}.pc-の{background:#dcdcdc}
.blank .pin{font-size:inherit}

/* まちがいさがし */
.chunks{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center}
.chunk{font-size:1.9rem;font-weight:700;letter-spacing:.08em;padding:.35rem .7rem;border-radius:14px;border:var(--bw) solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-height:3.6rem}
.chunk.sel{border-color:var(--accent);outline:3px solid var(--accent)}
.chunk.fixed{border-color:var(--ok);color:var(--ok);background:var(--surface2)}
/* 小さい字（ゃゅょっ など）は はっきり小さく、マスの左下に（点線のマスは出さない＝2026-10-16 カワイさん） */
.sk{display:inline-block;position:relative;width:.72em;height:1em;vertical-align:-.13em;margin:0 0 0 -.05em}
.qtop .sk .skc,.steps .sk .skc,.mode .sk .skc{font-size:.85em}.qtop .sk,.steps .sk,.mode .sk{width:.9em;margin:0}
.sk .skc{position:absolute;left:.04em;bottom:0;font-size:.7em;line-height:1;font-weight:inherit}
.opt .sk .skc,.word .sk .skc,.ch .sk .skc,.kana .sk .skc,.chunk .sk .skc,.sent .sk .skc,.blank .sk .skc,.ts .sk .skc{font-size:.6em}
/* まちがいさがしの ヒントと おうえん */
.chunk.harea{background:var(--soft);box-shadow:0 0 0 4px rgba(255,200,40,.55);animation:glow 1.6s ease-in-out infinite}
.chunk.hone{background:#fff6c4;color:#1d1b18;box-shadow:0 0 0 6px #ffc928,0 0 22px 6px rgba(255,190,30,.8);animation:glow .9s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12);transform:translateY(-3px)}}
.cheer{display:flex;align-items:flex-start;gap:.6rem;margin:.7rem 0 0;padding:.6rem .9rem;border-radius:18px;background:var(--soft);border:2px solid var(--line);font-weight:700;font-size:1.08rem;line-height:1.6}
.cheer .ce{font-size:1.9rem;line-height:1;flex:0 0 auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.cheer .ct{animation:pop .35s ease-out}
.hintbtn{min-height:2.6rem;font-size:1rem;padding:.2rem 1rem}
.hintbtn.wiggle{animation:wig 1s ease-in-out 3;border-color:#ffb020;background:#fff3c4;color:#1d1b18}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.06)}40%{transform:rotate(6deg) scale(1.06)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.hintsteps{display:inline-flex;gap:.2rem;margin-left:.3rem;vertical-align:middle}.hintsteps i{width:.55rem;height:.55rem;border-radius:50%;border:1.5px solid currentColor;opacity:.5}.hintsteps i.on{background:#ffb020;border-color:#ffb020;opacity:1}
.chunk.reading{background:var(--soft);border-color:var(--accent);transform:translateY(-4px);box-shadow:0 6px 0 var(--accent)}
.chunk.nope{animation:shake .35s}
.count{text-align:center;font-weight:700;font-size:1.1rem;margin:.5rem 0}
.count b{font-size:1.5rem;color:var(--accent)}

/* ことばさがし */
.cutline{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:0;margin:.8rem 0}
.ch{font-size:2.4rem;font-weight:700;padding:.1rem .1rem;line-height:1.5;display:flex;align-items:center;border:0;background:transparent;min-height:3.8rem;border-radius:8px}.ch:active{background:var(--soft)}
.cu{display:flex;white-space:nowrap}
.cutline .brk{flex-basis:100%;height:0}
.gap{width:1.6rem;min-height:3.8rem;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px}
.gap::after{content:"";width:3px;height:1.6rem;border-radius:3px;background:var(--line);opacity:.6}
.gap.on::after{width:6px;height:3.2rem;background:var(--accent);opacity:1}
.gap:hover::after{opacity:1}

/* 正解・まちがいのしるし */
.fb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40}
.fb .in{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:1.2rem 2.4rem;border-radius:28px;background:var(--surface);border:4px solid var(--ok);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.fb .mk{width:4.2rem;height:4.2rem;border-radius:50%;border:.7rem solid var(--ok)}
.fb .fe{font-size:4rem;line-height:1;animation:spin .6s ease-out}@keyframes spin{0%{transform:rotate(-200deg) scale(.4)}100%{transform:rotate(0) scale(1)}}
.fb .tx{font-family:var(--head);font-weight:900;font-size:2rem;color:var(--ok)}
.note{border-radius:var(--radius);border:3px solid var(--ng);background:var(--surface);padding:.8rem 1rem;margin-top:.6rem}
.note .ttl{display:flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:900;font-size:1.25rem;color:var(--ng)}
.note .tri{width:0;height:0;border-left:.7rem solid transparent;border-right:.7rem solid transparent;border-bottom:1.2rem solid var(--ng)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* おわり・きろく */
.result{text-align:center}
.result .big{font-family:var(--head);font-weight:900;font-size:2.2rem;margin:.3rem 0}
.result .stamp{font-size:4.5rem;display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.marks{display:flex;justify-content:center;gap:.6rem;margin:.6rem 0 1rem}
.marks i{width:2rem;height:2rem;border-radius:50%;border:.38rem solid var(--ok)}
.marks i.x{border:0;border-radius:0;width:0;height:0;border-left:1rem solid transparent;border-right:1rem solid transparent;border-bottom:1.7rem solid var(--ng)}
.stamps{display:flex;flex-wrap:wrap;gap:.3rem;font-size:2rem;line-height:1.2}
.tbl{width:100%;border-collapse:collapse;font-size:1rem}
.tbl td{padding:.45rem .3rem;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:700}
.chart{width:100%;height:auto;max-height:28vh;display:block}
.grid2{display:grid;gap:1rem}
.nglist{display:flex;flex-wrap:wrap;gap:.4rem}
.nglist span{padding:.2rem .7rem;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700}
.timer{height:.8rem;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:.2rem 0 .8rem}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.cd{font-family:var(--head);font-weight:900;font-size:6rem;text-align:center;animation:pop .5s}
.guide h3{font-family:var(--head);font-size:1.15rem;margin:1rem 0 .3rem}
.guide p,.guide li{font-size:1rem;line-height:1.85}

/* ふた（確認・案内） */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);color:var(--ink);border-radius:22px;border:var(--bw) solid var(--line);padding:1.3rem 1.3rem 1.1rem;max-width:30rem;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.modal .box h2{font-family:var(--head);font-size:1.35rem;margin:0 0 .5rem}
.modal .box p{margin:.2rem 0 1rem}

/* 最初の画面 */
.splash{position:fixed;inset:0;z-index:60;background:#bfe3f5 center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6vh;cursor:pointer;transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.splash h1{margin:0;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:clamp(2rem,8.6vw,5.6rem);white-space:nowrap;color:#fff;letter-spacing:.06em;line-height:1.1;-webkit-text-stroke:.09em #e2572f;paint-order:stroke fill;text-shadow:0 .08em 0 #b8401f;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.splash p{margin:.6rem 0 0;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:clamp(1rem,2.6vw,1.6rem);color:#2b2140;background:rgba(255,255,255,.88);padding:.2rem 1.1rem;border-radius:999px}
.splash .tap{position:absolute;bottom:3vh;font-size:1rem;font-weight:700;color:#2b2140;background:rgba(255,255,255,.8);padding:.2rem .9rem;border-radius:999px}


/* ホームの絵の帯と、カードの色 */
.hero{position:relative;height:9.5rem;border-radius:var(--radius);background:#bfe3f5 var(--title-img) center 72%/cover no-repeat;border:var(--bw) solid var(--line);box-shadow:var(--shadow);margin-bottom:1rem;display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;padding:.7rem .9rem;overflow:hidden;flex-wrap:wrap;align-content:flex-end}
.hero .hi{font-family:var(--head);font-weight:900;font-size:clamp(1.05rem,4.4vw,1.45rem);white-space:nowrap;background:rgba(255,255,255,.92);color:#2b2140;padding:.2rem 1rem;border-radius:999px;line-height:1.5}
.hero .st{font-weight:700;font-size:.95rem;background:rgba(255,255,255,.92);color:#2b2140;padding:.2rem .9rem;border-radius:999px;white-space:nowrap}
.hero .st b{font-size:1.25rem}
.c1{--c:#e8673c}.c2{--c:#2f7fd6}.c3{--c:#d64f8c}.c4{--c:#2f9a5a}.c5{--c:#8a56d6}
html[data-theme="kokuban"] .c1{--c:#f4d668}html[data-theme="kokuban"] .c2{--c:#9fd6f2}html[data-theme="kokuban"] .c3{--c:#f6a5b8}html[data-theme="kokuban"] .c4{--c:#b8e6a0}html[data-theme="kokuban"] .c5{--c:#e0c3ff}
html[data-theme="uchu"] .c1{--c:#ffe14d}html[data-theme="uchu"] .c2{--c:#4ff0ff}html[data-theme="uchu"] .c3{--c:#ff5fd2}html[data-theme="uchu"] .c4{--c:#74f5ad}html[data-theme="uchu"] .c5{--c:#c6a4ff}
.mode{flex-direction:row;align-items:flex-start;gap:.9rem;border-top:.45rem solid var(--c,var(--line))}
html[data-theme="omocha"] .mode{border-top-width:var(--bw)}
.mode .ic{flex:0 0 auto;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--c,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:900;font-size:1.7rem;line-height:1}
html[data-theme="kokuban"] .mode .ic,html[data-theme="uchu"] .mode .ic{color:#1b1b2b}
html[data-theme="omocha"] .mode .ic{background:#fff;color:#2b2140;border:var(--bw) solid #2b2140}
.mode .bd{display:flex;flex-direction:column;gap:.25rem;min-width:0;flex:1;align-self:stretch}
.mode .no{color:var(--ink)}
html[data-theme="omocha"] .mode .no{color:#2b2140}


/* ===================== 手（たたく・にぎる・のばす・ねじる） ===================== */
.hi2{display:inline-flex;align-items:center;justify-content:center;position:relative;line-height:1;vertical-align:middle}
.hi2 .he{display:inline-block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.hi2 .hx{position:static;margin-left:.02em;font-size:.95em;font-weight:900;color:var(--accent);font-family:var(--font);line-height:1}
.hi2.h-dbl .he{transform:rotate(-25deg)}
.hi2.sm{font-size:1.3rem}.hi2.md{font-size:2.3rem}.hi2.big{font-size:4.8rem}
.hi2.anim.h-dot .he{animation:hClap .45s ease-out}
.hi2.anim.h-ring .he{animation:hGrip .6s ease-out forwards}
.hi2.anim.h-bar .he{animation:hPush .75s ease-out}
.hi2.anim.h-dbl .he{animation:hTwist .65s ease-in-out}
@keyframes hClap{0%{transform:scale(.6)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes hGrip{0%{transform:scale(1.2)}60%{transform:scale(.78)}100%{transform:scale(.84)}}
@keyframes hPush{0%{transform:translateX(-35%)}100%{transform:translateX(35%)}}
@keyframes hTwist{0%{transform:rotate(-60deg)}55%{transform:rotate(45deg)}100%{transform:rotate(0)}}
.hi2.big.anim.h-dot::after{content:"";position:absolute;left:-.12em;top:-.12em;right:-.12em;bottom:-.12em;border-radius:50%;border:.05em solid var(--accent);animation:burst .5s ease-out forwards;opacity:0}
@keyframes burst{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.35);opacity:0}}
.col .hnd{display:flex;align-items:center;justify-content:center;min-height:1.7rem;transition:transform .2s}
.col.now .hnd{transform:scale(1.4)}
.cols.many .hi2.sm{font-size:1.1rem}.cols.many2 .hi2.sm{font-size:.95rem}.mini .hi2.sm{font-size:.9rem}.mini .hnd{min-height:1.2rem}

/* 見本を見せる所（大きな手＋かけ声） */
.cond{display:flex;align-items:center;justify-content:center;gap:1rem;min-height:7.4rem;margin:.2rem 0 .1rem}
.bighand{flex:0 0 auto;width:7.2rem;height:7.2rem;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--soft);border:var(--bw) solid var(--line)}
.bighand .cnt{font-family:var(--head);font-weight:900;font-size:2.3rem;color:var(--accent);animation:pop .4s;white-space:nowrap}
.bhl{min-width:6.6rem;min-height:4rem;font-weight:700;font-size:1.1rem;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.bhl b{font-family:var(--head);font-size:2.1rem;color:var(--accent);line-height:1.2}
.ctl{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.5rem 0 .8rem}
.seg.sm button{min-height:2.4rem;font-size:.9rem;padding:0 .8rem}

/* 3段（みる・まねる・ひとりで） */
.phases{display:flex;align-items:center;justify-content:center;gap:.45rem;margin:-.1rem 0 .9rem;flex-wrap:wrap}
.phases button{font-family:var(--head);font-weight:900;font-size:1rem;padding:.3rem 1rem;min-height:2.6rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--mute)}
.phases button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phases button.done{border-color:var(--ok);color:var(--ok)}
.phases i{font-style:normal;color:var(--mute);font-weight:900}
.fam{text-align:center;font-weight:700;color:var(--ink);background:var(--soft);border-radius:14px;padding:.45rem .8rem}
.pic.sm{font-size:3.6rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.vsi{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.7rem .5rem;border-radius:16px;border:var(--bw) solid var(--line);background:var(--surface2);text-align:center}
.vsi .sy{font-size:1.7rem}.vsi .eq,.pair .eq,.nu-ic .eq{color:var(--mute);font-weight:900;font-size:1rem}.vsi b{font-size:1.2rem}.vsi small{color:var(--mute);font-weight:700;font-size:.92rem}
.vsi.me{border-color:var(--accent);background:var(--soft);border-width:3px}

/* てパッド */
.pad{position:relative;height:8.5rem;border-radius:var(--radius);border:3px dashed var(--accent);background:var(--soft);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:box-shadow .15s,background-color .15s}
.pad.down{background-color:var(--surface2)}
.pad.down::before{content:"";position:absolute;left:50%;top:50%;width:3.4rem;height:3.4rem;margin:-1.7rem 0 0 -1.7rem;border-radius:50%;border:.35rem solid var(--accent);opacity:.25;transform:scale(.4);animation:holdGrow .6s linear forwards;pointer-events:none}
@keyframes holdGrow{to{transform:scale(1);opacity:.9}}
.pad.hold{box-shadow:inset 0 0 0 .6rem var(--accent)}
.pad .padtx{font-family:var(--head);font-weight:900;font-size:1.15rem;color:var(--mute);text-align:center;line-height:1.6;pointer-events:none}
.pad .padfx{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pfx{display:flex;align-items:center;gap:.6rem;font-size:2.4rem;background:var(--surface);padding:.35rem 1.1rem;border-radius:999px;border:var(--bw) solid var(--line);box-shadow:var(--shadow);animation:pop .3s}
.pfx .sy{font-size:2rem}
.pfx.ag{font-family:var(--head);font-weight:900;font-size:1.1rem;padding:.5rem 1.1rem;color:var(--ink);text-align:center}
.pfx.want{border:3px solid var(--accent);font-size:2.2rem}.pfx.want b{font-family:var(--head);font-size:1.4rem;color:var(--accent)}
.padkey{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .9rem;font-size:.95rem;margin:.6rem 0 .2rem}
.padkey span{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.padkey b{color:var(--accent)}
.hbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}
.hb{min-height:4.4rem;border-radius:14px;border:var(--bw) solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-weight:700;padding:.3rem .2rem;line-height:1.25}
.hb .hbt{display:flex;align-items:center;gap:.35rem}.hb .sy{font-size:1.05rem}
.hb .hbl{font-size:1rem}.hb .hbg{font-size:.85rem;color:var(--ink);font-weight:700;opacity:.8;word-break:keep-all;overflow-wrap:anywhere;text-align:center}
.hbs,.pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hb:active{transform:scale(.95)}
.sm2{font-size:.92rem;text-align:center;margin:.4rem 0 .35rem}

/* 手で入れた じゅんばん */
.tslots{display:flex;justify-content:center;gap:.4rem;flex-wrap:nowrap;margin:.2rem 0 .3rem;width:100%}
.ts{display:flex;flex-direction:column;align-items:center;gap:.2rem;flex:1 1 0;min-width:0;max-width:3.6rem;padding:.4rem .2rem;border-radius:14px;border:2px dashed var(--line);background:var(--surface);transition:transform .15s}
.ts .sy{font-size:1.35rem}.ts .sl{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-height:3.3rem;justify-content:center}
.ts .q{font-size:1.6rem;font-weight:900;color:var(--accent)}
.ts .kana{font-size:1.75rem;font-weight:700;line-height:1.2;white-space:nowrap}
.ts.ok{border-style:solid;border-color:var(--ok)}
.ts.cur{border-style:solid;border-color:var(--accent);background:var(--soft);transform:translateY(-4px)}
.ts.bad{animation:shake .35s}
.tslots.many{gap:.2rem}.tslots.many .ts{padding:.3rem .05rem}.tslots.many .ts .sy{font-size:1.05rem}.tslots.many .ts .q{font-size:1.2rem}.tslots.many .ts .kana{font-size:1.3rem}.tslots.many .hi2.sm{font-size:1rem}
.tmsg{text-align:center;min-height:1.9em;font-weight:700;margin:.3rem 0 .5rem}

/* きごうと 手の 早見 */
.keybar{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin:.2rem 0 1rem}
.kb{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .9rem;border-radius:999px;border:var(--bw) solid var(--line);background:var(--surface);font-size:1rem}
.kb .sy{font-size:1.05rem}.kb small{color:var(--mute);font-weight:700;font-size:.85rem}

/* ホーム：つぎは これ */
.nextup{width:100%;display:flex;align-items:center;gap:1rem;text-align:left;padding:1rem 1.2rem;margin:0 0 1.1rem;border-radius:var(--radius);border:3px solid var(--accent);background:var(--surface);box-shadow:var(--shadow);position:relative}
.nextup:hover{transform:translateY(-2px)}
.nu-ic{flex:0 0 auto;display:flex;align-items:center;gap:.45rem;font-size:2rem;padding:.45rem .9rem;border-radius:18px;background:var(--soft);border:1px solid var(--line)}
.nu-ic .sy{font-size:1.6rem}
.nu-bd{flex:1;display:flex;flex-direction:column;min-width:0}
.nu-l{font-size:.92rem;font-weight:700;color:var(--accent)}

const SMALL = "ゃゅょャュョぁぃぅぇぉァィゥェォ";
const SMALL_V = {"ゃ":"a","ャ":"a","ぁ":"a","ァ":"a","ぃ":"i","ィ":"i","ゅ":"u","ュ":"u","ぅ":"u","ゥ":"u","ぇ":"e","ェ":"e","ょ":"o","ョ":"o","ぉ":"o","ォ":"o"};
const ROWS = {a:"あかさたなはまやらわがざだばぱアカサタナハマヤラワガザダバパ",i:"いきしちにひみりぎじぢびぴイキシチニヒミリギジヂビピ",u:"うくすつぬふむゆるぐずづぶぷウクスツヌフムユルグズヅブプヴ",e:"えけせてねへめれげぜでべぺエケセテネヘメレゲゼデベペ",o:"おこそとのほもよろをごぞどぼぽオコソトノホモヨロヲゴゾドボポ"};
function vowelOf(ch){for(const v in ROWS){if(ROWS[v].indexOf(ch)>=0)return v;}return null;}
const LONG = {a:"あ",i:"い",u:"う",e:"え",o:"うお"};
/* 1つの言葉を [{m:"dot|ring|bar|dbl", k:"字"}] に分ける */
function moras(word){
  const out=[];let pv=null;const ch=Array.from(word);
  for(let i=0;i<ch.length;i++){
    const c=ch[i],n=ch[i+1];
    if(c==="っ"||c==="ッ"){out.push({m:"ring",k:c});pv=null;continue;}
    if(c==="ー"){out.push({m:"bar",k:c});pv=null;continue;}
    if(n&&SMALL.indexOf(n)>=0){out.push({m:"dbl",k:c+n});pv=SMALL_V[n];i++;continue;}
    const hv=({"ア":"あ","イ":"い","ウ":"う","エ":"え","オ":"お"})[c]||c;
    if("あいうえお".indexOf(hv)>=0&&pv&&LONG[pv].indexOf(hv)>=0){out.push({m:"bar",k:c});pv=null;continue;}
    out.push({m:"dot",k:c});pv=vowelOf(c);
  }
  return out;
}
function symKey(word){return moras(word).map(x=>x.m).join(",");}
function symHTML(ms){return '<span class="syms">'+ms.map(m=>'<i class="sy '+m+'"></i>').join("")+'</span>';}

const $=s=>document.querySelector(s);
const view=()=>document.getElementById("view");
const SK_RE=/[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ]/;
function wrapSmallKana(root){
  if(!root)return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!SK_RE.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const pe=n.parentElement;if(!pe||pe.closest(".sk,script,style,textarea,svg,.topbar,.look"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);
  list.forEach(n=>{
    const f=document.createDocumentFragment();let buf="";
    for(const ch of n.nodeValue){
      if(SK_RE.test(ch)){if(buf){f.appendChild(document.createTextNode(buf));buf="";}
        const o=document.createElement("span");o.className="sk";const c=document.createElement("span");c.className="skc";c.textContent=ch;o.appendChild(c);f.appendChild(o);}
      else buf+=ch;}
    if(buf)f.appendChild(document.createTextNode(buf));
    n.parentNode.replaceChild(f,n);
  });
}
new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{
  if(n.nodeType===3){if(n.parentElement)wrapSmallKana(n.parentElement);}else if(n.nodeType===1&&!n.classList.contains("sk"))wrapSmallKana(n);}));})
  .observe(document.body,{childList:true,subtree:true});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
/* すきなものに 合う問題を 多め（6わり）に。fOf=その問題の すきなもの */
function pickFav(a,n,fOf){
  const L=store.likes||[];if(!L.length)return pick(a,n);
  const fav=shuffle(a.filter(x=>L.indexOf(fOf(x))>=0)),rest=shuffle(a.filter(x=>L.indexOf(fOf(x))<0));
  const k=Math.min(fav.length,Math.ceil(n*.6));
  return shuffle(fav.slice(0,k).concat(rest.slice(0,n-k)).concat(fav.slice(k)).slice(0,n));
}

function itemFromKey(key){
  const [t,v]=[key.slice(0,1),key.slice(2)];
  if(t==="w"){const w=W(v);return w?{type:"spell",w:w}:null;}
  if(t==="p")return PART[+v]?{type:"part",i:+v}:null;
  if(t==="k")return KAKI[+v]?{type:"kaki",i:+v}:null;
  if(t==="f")return FIX[+v]?{type:"fix",i:+v}:null;
  return null;
}

  const keys=Object.keys(store.nigate).sort((a,b)=>store.nigate[b].n-store.nigate[a].n).slice(0,5);
  const items=keys.map(itemFromKey).filter(Boolean);
  if(!items.length){home();return;}

let R=null;
function runRound(cfg){R={cfg:cfg,items:cfg.items,idx:0,wrong:[],missed:false};showItem();}
function itemKey(it){if(it.w)return "w:"+it.w.k;if(it.type==="part")return "p:"+it.i;if(it.type==="kaki")return "k:"+it.i;if(it.type==="fix")return "f:"+it.i;return "";}

  if(R.cfg.steps&&it.step!=null)h+='<span class="steps">'+STEP_NAMES.map((n,i)=>'<span class="'+(i===it.step?"on":"")+'">'+(i+1)+'<span class="sn"> '+n+'</span></span>').join("")+'</span>';
  h+='<span class="dots">'+R.items.map((x,i)=>'<i class="'+(i<R.idx?"done":i===R.idx?"now":"")+'"></i>').join("")+'</span></div>';
  if(R.cfg.note&&R.idx===0)h+='<p class="say">'+esc(R.cfg.note)+'</p>';

}
function showItem(){
  const it=R.items[R.idx];R.missed=false;

/* 1もん おわった。ok=1かいめで できたか */
function next(){
  const it=R.items[R.idx];
  if(it.type!=="rule"){
    store.answered++;if(!R.missed)store.correct++;
    if(R.missed)R.wrong.push(it);
    if(R.cfg.kind!=="min")markNigate(itemKey(it),!R.missed);
    save();
  }
  R.idx++;
  if(R.idx<R.items.length){showItem();return;}
  finish();
}
function miss(){if(!R.missed){R.missed=true;}}
function finish(){
  const cfg=R.cfg,wrong=R.wrong,scored=R.items.filter(x=>x.type!=="rule");
  if(cfg.done){cfg.done(wrong);return;}
  const st=STAMPS[Math.floor(Math.random()*STAMPS.length)];store.stamps.push(st);
  if(store.rounds[cfg.kind]!=null)store.rounds[cfg.kind]++;
  const extra=cfg.onFinish?cfg.onFinish(wrong):"";save();
  const ok=scored.length-wrong.length;
  let h='<div class="result card"><div class="stamp">'+st+'</div><div class="big">'+(wrong.length?"よく がんばったね！":"ぜんぶ ピタッと！")+'</div>';
  h+='<div class="marks">'+scored.map(x=>'<i class="'+(wrong.indexOf(x)>=0?"x":"")+'"></i>').join("")+'</div>';
  h+='<p class="lead">'+scored.length+'もん ちゅう '+ok+'もん 1かいで できた。スタンプを 1こ もらったよ。'+(extra?'<br><b>'+esc(extra)+'</b>':"")+'</p><div class="row">';
  if(wrong.length)h+='<button class="btn" id="again">まちがえた '+wrong.length+'もんを もういちど</button>';
  h+='<button class="btn'+(wrong.length?" ghost":"")+'" id="back">'+esc(cfg.nextLabel||"メニューへ")+'</button><button class="btn ghost" id="toHome">ホーム</button></div></div>';
  setView(h);
  if(wrong.length)$("#again").onclick=()=>runRound(Object.assign({},cfg,{items:wrong.map(x=>Object.assign({},x)),title:cfg.title+"（もういちど）",onFinish:null,note:null}));
  $("#back").onclick=()=>(cfg.after||home)();$("#toHome").onclick=home;
}

function condHTML(word,hideKana){return '<div class="cond"><div class="bighand"></div><div class="bhl"></div></div>'+colsHTML(word,hideKana);}
function beatMs(){return store.tempo==="fast"?650:1000;}
function conduct(root,o){
  o=o||{};const cs=Array.from(root.querySelectorAll(".col"));const bh=root.querySelector(".bighand"),bl=root.querySelector(".bhl");
  let i=0,rep=0;
  const step=()=>{cs.forEach(c=>c.classList.remove("now"));
    if(i>=cs.length){rep++;
      if(o.loop&&(!o.times||rep<o.times)){i=0;later(step,beatMs());return;}
      if(bh)bh.innerHTML="";if(bl)bl.innerHTML="";o.onEnd&&o.onEnd();return;}
    const c=cs[i],m=c.dataset.m;c.classList.add("now");
    const hi=c.querySelector(".hi2");if(hi){hi.classList.remove("anim");void hi.offsetWidth;hi.classList.add("anim");}
    if(bh)bh.innerHTML=handIcon(m,"big anim");
    if(bl)bl.innerHTML='<b>'+HAND[m].say+'</b>'+HAND[m].lb;
    sfx(m);i++;later(step,beatMs());};
  later(step,o.delay!=null?o.delay:400);
}

/* ---------- 手を たたく などの 音（えらんだ時だけ） ---------- */
let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==="suspended")AC.resume();return AC;}catch(e){return null;}}
function sfx(m,force){
  if(!store.sfx&&!force)return;const a=ac();if(!a)return;const t=a.currentTime;
  const clap=(at)=>{const len=Math.floor(a.sampleRate*.09),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;f.type="bandpass";f.frequency.value=1400;f.Q.value=.8;g.gain.value=.9;
    src.connect(f);f.connect(g);g.connect(a.destination);src.start(at);};
  const tone=(at,f1,f2,dur,vol,type)=>{const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f1,at);o.frequency.linearRampToValueAtTime(f2,at+dur);
    g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.02);g.gain.setValueAtTime(vol,at+dur-.06);g.gain.linearRampToValueAtTime(0,at+dur);o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+dur+.02);};
  if(m==="dot")clap(t);
  else if(m==="ring")tone(t,240,200,.15,.3,"sine");          /* っ は こえを とめる＝小さな「ぐっ」だけ */
  else if(m==="bar")tone(t,523,523,Math.min(.7,beatMs()/1000*.75),.16,"triangle");
  else if(m==="dbl")tone(t,380,820,.18,.2,"triangle");
}

/* ---------- てパッド（トン・ぎゅー・すーっ・くるっ）＋ボタン ---------- */
function padHTML(){
  return '<div class="pad" role="group" aria-label="てパッド"><div class="padtx">ここで てを うごかそう</div><div class="padfx"></div></div>'+
    '<p class="say sm2">うごかしかた（ボタンを おしても いいよ）</p><div class="hbs">'+MS.map(m=>'<button class="hb" data-m="'+m+'"><span class="hbt"><i class="sy '+m+'"></i>'+handIcon(m,"sm")+'</span><span class="hbl">'+HAND[m].lb+'</span><span class="hbg">'+HAND[m].ges+'</span></button>').join("")+'</div>';
}
function bindPad(root,cb){
  const pad=root.querySelector(".pad"),fx=root.querySelector(".padfx"),tx=root.querySelector(".padtx");
  const show=m=>{if(tx)tx.style.visibility="hidden";fx.innerHTML='<span class="pfx"><i class="sy '+m+'"></i>'+handIcon(m,"md anim")+'</span>';};
  const emit=m=>{show(m);cb(m);};
  const again=t=>{if(tx)tx.style.visibility="hidden";fx.innerHTML='<span class="pfx ag">'+t+'</span>';};
  /* トン（みじかい）／ぎゅー（600ミリ秒 おさえる）／まっすぐ すーっ／くるっ（半回転より 多く）。どれとも いえない 動きは「もういちど」 */
  const HOLD=600;
  let st=null,ht=null;
  const reset=()=>{clearTimeout(ht);ht=null;st=null;pad.classList.remove("down","hold");};
  pad.addEventListener("pointerdown",e=>{if(busy)return;if(e.isPrimary===false||st)return;e.preventDefault();clearTimeout(ht);try{pad.setPointerCapture(e.pointerId);}catch(_){}
    st={id:e.pointerId,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,t:Date.now(),ang:0,len:0,pa:null,held:false};pad.classList.add("down");
    ht=setTimeout(()=>{if(st&&st.len<40){st.held=true;pad.classList.add("hold");if(navigator.vibrate)try{navigator.vibrate(25);}catch(_){}}},HOLD);});
  pad.addEventListener("pointermove",e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.px,dy=e.clientY-st.py,d=Math.hypot(dx,dy);if(d<6)return;
    const a=Math.atan2(dy,dx);if(st.pa!=null){let da=a-st.pa;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;st.ang+=da;}
    st.pa=a;st.len+=d;st.px=e.clientX;st.py=e.clientY;});
  pad.addEventListener("pointerup",e=>{if(!st||e.pointerId!==st.id)return;const s0=st,dist=Math.hypot(e.clientX-s0.x,e.clientY-s0.y),dt=Date.now()-s0.t;reset();
    let m=null;
    if(Math.abs(s0.ang)>=2.5&&s0.len>60)m="dbl";
    else if(Math.abs(s0.ang)<1.2&&dist>=55)m="bar";
    else if(s0.len<40&&dist<40)m=(s0.held||dt>=HOLD)?"ring":"dot";   /* わっかが まんたんに なるまで おしたら にぎる */
    if(m)emit(m);else again("もういちど。まっすぐ すーっ、または くるっと");});
  pad.addEventListener("pointercancel",reset);
  pad.addEventListener("contextmenu",e=>e.preventDefault());
  root.querySelectorAll(".hb").forEach(b=>{b.onclick=()=>{if(busy)return;emit(b.dataset.m);};b.addEventListener("contextmenu",e=>e.preventDefault());});
}
/* 手で 1つずつ いれる。まちがえたら その場で 正しい 手を 見せる */
function seqTask(root,word,o){
  const T=moras(word);let pos=0,done=false;
  root.innerHTML='<div class="tslots" id="ts"></div><p class="say tmsg" id="tmsg">こえに だしながら、1つずつ てで いれよう</p>'+padHTML();
  const draw=bad=>{const ts=$("#ts");ts.className="tslots"+(T.length>=6?" many":"");
    ts.innerHTML=T.map((x,i)=>'<div class="ts'+(i<pos?" ok":(i===pos&&!done?" cur":""))+(bad&&i===pos?" bad":"")+'"><span class="sl">'+(i<pos?'<i class="sy '+x.m+'"></i>'+handIcon(x.m,"sm"):'<span class="q">'+(i===pos&&!done?"？":"")+'</span>')+'</span><span class="kana">'+esc(x.k)+'</span></div>').join("");};
  draw();
  bindPad(root,m=>{
    if(done||busy)return;const want=T[pos].m;
    if(m===want){sfx(m);pos++;draw();$("#tmsg").textContent=pos<T.length?"いいね！ つぎの 字":"";if(pos===T.length){done=true;o.onDone&&o.onDone();}}
    else{if(o.scored)miss();draw(true);
      const fx=root.querySelector(".padfx");if(fx)fx.innerHTML='<span class="pfx want"><i class="sy '+want+'"></i>'+handIcon(want,"md anim")+'<b>'+HAND[want].lb+'</b></span>';
      $("#tmsg").innerHTML='「'+esc(T[pos].k)+'」は '+handIcon(want,"sm")+' <b>'+HAND[want].lb+'</b> だよ。もういちど！';}
  });
}

/* きまり：① みる（大きな手の見本）→ ② まねる（3・2・1・せーの で いっしょに）→ ③ ひとりで（てパッドで いれる） */
function qRule(it){
  const S=SOUNDS[it.snd],w=W(S.ex);let ph=0;

/* 記号：ことばの 音の かたちを 3つから */
function symOptions(w){
  const seen={},out=[];const add=key=>{if(key&&!seen[key]){seen[key]=1;out.push(key);}};
  add(symKey(w.k));w.d.forEach(d=>add(symKey(d)));
  const base=symKey(w.k).split(",");
  const muts=[base.map(m=>m==="dot"?m:"dot"),base.filter(m=>m==="dot"),base.concat(["dot"]),base.map(m=>m==="dbl"?"dot,dot":m).join(",").split(","),base.map(m=>m==="bar"?"dot":m)];
  muts.forEach(m=>{if(out.length<3)add(m.join(","));});
  return shuffle(out.slice(0,3));
}
function qSym(it){
  const w=it.w,right=symKey(w.k);const opts=symOptions(w);
  let h=head()+'<div class="qwrap"><div class="qL card"><p class="prompt">おとの かたちは どれ？</p><div class="pic" style="font-size:4rem">'+w.e+'</div><div class="word">'+esc(w.k)+'</div>'+keybar()+'<div id="fix"></div></div>';
  h+='<div class="qR"><div class="opts">'+opts.map((o,i)=>{const a=o.split(","),mx=Math.max.apply(null,opts.map(x=>x.split(",").length));return '<button class="opt symopt'+(mx>=7?" n7":mx>=5?" n5":"")+'" data-v="'+o+'"><span class="k">'+(i+1)+'</span><span class="sycols">'+a.map(m=>'<span class="syc"><i class="sy '+m+'"></i>'+handIcon(m,"sm")+'</span>').join("")+'</span></button>';}).join("")+'</div></div></div>';
  setView(h);bindOpts(".opt",v=>v===right,()=>correction(w,view().querySelector(".qR"),()=>{const m=R.missed;qSym(it);R.missed=m;}));

/* えらぶ ボタンの しくみ（れんだ・数字キー） */
function bindOpts(sel,isRight,onWrong){
  const bs=Array.from(view().querySelectorAll(sel));
  bs.forEach(b=>b.onclick=()=>{
    if(busy||b.disabled)return;
    if(isRight(b.dataset.v)){b.classList.add("right");bs.forEach(x=>x.disabled=true);showOK("ピタッと！",next);}
    else{miss();b.classList.add("wrong");b.disabled=true;onWrong&&onWrong(b.dataset.v);}
  });
}

/* まちがいの しゅるい：n=くっつきの ことばが ぬけ／k=は・を・へ の かきわけ／o=音（っ・ー・ゃゅょ） */
function fixKind(c){
  if(c.c.indexOf(c.w)===0&&c.c.length>c.w.length)return "n";
  const a=c.w.slice(-1),b=c.c.slice(-1);
  if(c.w.slice(0,-1)===c.c.slice(0,-1)&&({"わ":"は","お":"を","え":"へ"})[a]===b)return "k";
  return "o";
}
/* なおす ことばから、記号で 見せる 言葉を とりだす（助詞を のぞく） */
function fixWord(chunk){
  for(const w of LEX){if(chunk.indexOf(w.k)===0)return w.k;}
  const strip=chunk.replace(/(は|を|へ|が|に|で|と|や|の)$/,"");
  return moras(strip).some(x=>x.m!=="dot")?strip:"";
}

let cutRelayout=null;

function qCut(it){
  const ws=it.ws,text=ws.map(w=>w.k).join(""),chars=Array.from(text);
  const ans=[];let p=0;ws.slice(0,2).forEach(w=>{p+=Array.from(w.k).length;ans.push(p);});
  let cuts=[];
  let h=head()+'<div class="qwrap wideL"><div class="qL card"><p class="prompt">ことばを 3つ みつけよう</p><p class="say">ことばの おわりの 字を タップすると、その うしろに たての ぼうが はいるよ。ぼうを 2本 いれよう。</p><div class="cutline" id="cl"></div><div id="fix"></div></div>';
  h+='<div class="qR card"><p class="prompt" id="cc">ぼう 0 本</p><div class="row"><button class="btn ghost" id="clr">ぜんぶ けす</button><button class="btn" id="ok" disabled>これで けってい</button></div><div id="cutfb"></div></div></div>';
  setView(h);
  /* 「ちょ」のように 小さい字（っ・ー以外）は まえの字と 1つの かたまり。かたまりの 中では 行も ぼうも わけない */
  const units=[];chars.forEach((c,i)=>{if(units.length&&/[ぁぃぅぇぉゃゅょゎァィゥェォャュョヮ]/.test(c)){const u=units[units.length-1];u.s+=c;u.end=i+1;}else units.push({s:c,end:i+1});});
  /* 行の かわりめが ことばの さかいめと 重なると 答えが 見えてしまう → その 1つ前の かたまりから つぎの 行へ */
  const breakLines=()=>{const cl=$("#cl");if(!cl)return;wrapSmallKana(cl);cl.querySelectorAll(".brk").forEach(b=>b.remove());
    for(let guard=0;guard<20;guard++){const us=Array.from(cl.querySelectorAll(".cu"));let moved=false;
      for(let k=1;k<us.length;k++){if(us[k].offsetTop>us[k-1].offsetTop+4){
        if(ans.indexOf(units[k-1].end)>=0&&k>=2&&!(us[k-1].previousElementSibling&&us[k-1].previousElementSibling.classList.contains("brk"))){const b=document.createElement("i");b.className="brk";us[k-1].before(b);moved=true;break;}}}
      if(!moved)break;}};
  const draw=()=>{
    let s="";units.forEach((u,k)=>{const last=k===units.length-1;s+='<span class="cu"><button class="ch" data-p="'+(last?"":u.end)+'">'+esc(u.s)+'</button>';if(!last)s+='<button class="gap'+(cuts.indexOf(u.end)>=0?" on":"")+'" data-p="'+u.end+'" aria-label="ここで きる"></button>';s+='</span>';});
    $("#cl").innerHTML=s;breakLines();$("#cc").textContent="ぼう "+cuts.length+" 本";$("#ok").disabled=cuts.length!==2;
    view().querySelectorAll(".gap,.ch").forEach(g=>g.onclick=()=>{if(busy||solved||!g.dataset.p)return;const v=+g.dataset.p,k=cuts.indexOf(v);
      if(k>=0)cuts.splice(k,1);else if(cuts.length<2)cuts.push(v);else{cuts.shift();cuts.push(v);}draw();});
  };
  draw();cutRelayout=breakLines;if(document.fonts)document.fonts.ready.then(()=>{if(cutRelayout===breakLines)breakLines();});
  $("#clr").onclick=()=>{if(busy)return;cuts=[];draw();};
  let solved=false;
  $("#ok").onclick=()=>{if(busy||solved||cuts.length!==2)return;
    const c=cuts.slice().sort((a,b)=>a-b);
    const show='<div class="row" style="font-size:1.35rem;font-weight:700;gap:.4rem 1rem;margin-top:.4rem;line-height:1.4">'+ws.map(w=>'<span>'+w.e+' '+esc(w.k)+'</span>').join("")+'</div>';
    if(c[0]===ans[0]&&c[1]===ans[1]){solved=true;$("#ok").disabled=true;$("#clr").disabled=true;$("#fix").innerHTML=show;showOK("ピタッと！",()=>later(next,500));}
    else{miss();cuts=[];draw();$("#cutfb").innerHTML='<div class="note"><div class="ttl"><i class="tri"></i>おしい！ この 3つだよ</div>'+show+'<p class="say" style="text-align:center;margin:.3rem 0 0">もういちど ぼうを いれて みよう。</p></div>';$("#cutfb").scrollIntoView({block:"nearest",behavior:"smooth"});}
  };
}

/* ===================== 5 1ぷん チャレンジ ===================== */
function minuteStart(){
  const best=store.minute.length?Math.max.apply(null,store.minute.map(x=>x.n)):0;
  let h='<div class="h1">1ぷん チャレンジ</div><div class="card" style="text-align:center"><p class="lead" style="font-size:1.15rem">えを みて、ただしい かきかたを えらぶ。<br>1ぷんで いくつ ピタッと できるかな。</p>'+
    (best?'<p style="font-weight:700">これまでの さいこう：'+best+' もん</p>':"")+'<div class="row"><button class="btn" id="go">よーい スタート</button></div></div>';
  if(store.minute.length)h+='<div class="card" style="margin-top:1rem"><p class="prompt">これまでの きろく</p>'+chartSVG()+'</div>';
  setView(h);$("#go").onclick=countdown;
}
function countdown(){
  let n=3;const tick=()=>{if(n===0){minuteRun();return;}setView('<div class="cd">'+n+'</div>');n--;later(tick,800);};tick();
}
function minuteRun(){
  const end=Date.now()+60000;let ok=0,ng=0,last=null;
  const one=()=>{
    const L=store.likes||[],favW=LEX.filter(x=>L.indexOf(x.f)>=0),pool=(favW.length&&Math.random()<.5)?favW:LEX;
    let w;do{w=pool[Math.floor(Math.random()*pool.length)];}while(w===last&&pool.length>1);last=w;
    const opts=shuffle([w.k].concat(w.d));
    const remain=Math.max(0,end-Date.now());
    let h='<div class="qtop"><span class="ttl">1ぷん チャレンジ</span><span style="margin-left:auto;font-weight:700">ピタッと '+ok+'</span></div><div class="timer"><i id="tb" style="width:'+(remain/600)+'%"></i></div>';
    h+='<div class="qwrap"><div class="qL card"><div class="pic">'+w.e+'</div></div><div class="qR"><div class="opts">'+opts.map((o,i)=>'<button class="opt" data-v="'+esc(o)+'"><span class="k">'+(i+1)+'</span>'+esc(o)+'</button>').join("")+'</div></div></div>';
    clearTimers();view().innerHTML=h;$("#homeBtn").hidden=false;
    const iv=setInterval(()=>{const r=Math.max(0,end-Date.now());const tb=$("#tb");if(tb)tb.style.width=(r/600)+"%";if(r<=0)fin();},250);timers.push(iv);
    view().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(busy)return;busy=true;
      if(b.dataset.v===w.k){ok++;b.classList.add("right");}else{ng++;b.classList.add("wrong");view().querySelector('.opt[data-v="'+w.k+'"]').classList.add("right");}
      setTimeout(()=>{busy=false;if(Date.now()<end)one();},b.dataset.v===w.k?220:700);});
  };
  let done=false;
  const fin=()=>{if(done)return;done=true;clearTimers();busy=false;
    const prevBest=store.minute.length?Math.max.apply(null,store.minute.map(x=>x.n)):-1;
    const d=new Date();store.minute.push({d:(d.getMonth()+1)+"/"+d.getDate(),n:ok});if(store.minute.length>60)store.minute.shift();
    store.rounds.min++;const st=STAMPS[Math.floor(Math.random()*STAMPS.length)];store.stamps.push(st);save();
    const best=Math.max.apply(null,store.minute.map(x=>x.n));
    setView('<div class="result card"><div class="stamp">'+st+'</div><div class="big">'+ok+' もん ピタッと！</div><p class="lead">'+(prevBest>=0&&ok>prevBest?"さいこう きろく！ ":"")+'まちがい '+ng+' もん。</p>'+chartSVG()+'<div class="row" style="margin-top:1rem"><button class="btn" id="again">もういちど</button><button class="btn ghost" id="toHome">ホーム</button></div></div>');
    $("#again").onclick=countdown;$("#toHome").onclick=home;
  };
  one();
}
function chartSVG(){
  const a=store.minute.slice(-10);if(!a.length)return "";
  const W=600,H=220,pad=34,max=Math.max(5,Math.max.apply(null,a.map(x=>x.n)));
  const bw=(W-pad*2)/a.length;let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="1ぷんチャレンジの きろく">';
  s+='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="currentColor" stroke-opacity=".35"/>';
  a.forEach((x,i)=>{const h=(H-pad*2)*(x.n/max),X=pad+i*bw+bw*.18,Y=H-pad-h;
    s+='<rect x="'+X+'" y="'+Y+'" width="'+(bw*.64)+'" height="'+h+'" rx="6" fill="var(--accent)"/>';
    s+='<text x="'+(X+bw*.32)+'" y="'+(Y-6)+'" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">'+x.n+'</text>';
    s+='<text x="'+(X+bw*.32)+'" y="'+(H-pad+20)+'" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity=".75">'+esc(x.d)+'</text>';});
  return s+'</svg>';
}

}
